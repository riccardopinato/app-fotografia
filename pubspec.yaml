name: framelab
description: "Un assistente offline-first per imparare la fotografia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  drift: ^2.30.0
  drift_flutter: ^0.2.6
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.30.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - editorial/catalog/package.json
    - editorial/catalog/assets/
